AWSTemplateFormatVersion: '2010-09-09'
Description: 'SCPs para AWS Organization - Desplegar después de crear la Organization'

Parameters:
  OrganizationRootId:
    Type: String
    Description: Root ID de la Organization (ej. r-xxxx)
  
  WorkloadsOUId:
    Type: String
    Description: OU ID de Workloads
  
  SandboxOUId:
    Type: String
    Description: OU ID de Sandbox
  
  DevOUId:
    Type: String
    Description: OU ID de Dev

Resources:

  # SCP 1: Proteger la cuenta Management (Root) - Impide acciones con usuario root
  ProtectManagementAccountSCP:
    Type: AWS::Organizations::Policy
    Properties:
      Name: Protect-Management-Account
      Description: Protege la cuenta raíz de acciones peligrosas usando credenciales root
      Type: SERVICE_CONTROL_POLICY
      Content:
        Version: "2012-10-17"
        Statement:
          - Sid: ProtectRootUser
            Effect: Deny
            Action: "*"
            Resource: "*"
            Condition:
              StringEquals:
                aws:PrincipalARN: "arn:aws:iam::${aws:accountId}:root"
      TargetIds:
        - !Ref OrganizationRootId

  # SCP 2: Restringir regiones permitiendo servicios globales
  RestrictRegionsSCP:
    Type: AWS::Organizations::Policy
    Properties:
      Name: Restrict-Regions
      Description: Permite regiones aprobadas y servicios globales esenciales
      Type: SERVICE_CONTROL_POLICY
      Content:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyUnsupportedRegions
            Effect: Deny
            NotAction:
              # Lista de servicios que NO deben ser bloqueados (servicios globales)
              - iam:*
              - organizations:*
              - route53:*
              - budgets:*
              - waf:*
              - cloudfront:*
              - globalaccelerator:*
              - support:*
              - trustedadvisor:*
              - sts:*
              - sso:*
              - ce:*
              - chatbot:*
            Resource: "*"
            Condition:
              StringNotEquals:
                aws:RequestedRegion:
                  - us-east-1
                  - sa-east-1
      TargetIds:
        - !Ref OrganizationRootId

  # SCP 3: Forzar tagging obligatorio (CostCenter y Environment)
  RequireTagsSCP:
    Type: AWS::Organizations::Policy
    Properties:
      Name: Require-Tags
      Description: Obliga a usar tags CostCenter y Environment en recursos clave
      Type: SERVICE_CONTROL_POLICY
      Content:
        Version: "2012-10-17"
        Statement:
          - Sid: RequireCostCenterAndEnvironment
            Effect: Deny
            Action:
              - ec2:RunInstances
              - s3:CreateBucket
              - rds:CreateDBInstance
              - lambda:CreateFunction
              - dynamodb:CreateTable
            Resource: "*"
            Condition:
              StringLike:
                "aws:RequestTag/CostCenter": "*"
                "aws:RequestTag/Environment": "*"
      TargetIds:
        - !Ref WorkloadsOUId

  # SCP 4: Evitar que las cuentas salgan de la Organization
  PreventLeavingOrgSCP:
    Type: AWS::Organizations::Policy
    Properties:
      Name: Prevent-Leaving-Organization
      Description: Impide que las cuentas miembro abandonen la Organization
      Type: SERVICE_CONTROL_POLICY
      Content:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyLeaveOrganization
            Effect: Deny
            Action: organizations:LeaveOrganization
            Resource: "*"
      TargetIds:
        - !Ref OrganizationRootId

  # SCP 5: Denegar recursos caros en Sandbox y Dev (control de costos)
  DenyExpensiveResourcesSCP:
    Type: AWS::Organizations::Policy
    Properties:
      Name: Deny-Expensive-Resources
      Description: Bloquea instancias y recursos muy caros en entornos no productivos
      Type: SERVICE_CONTROL_POLICY
      Content:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyHighCostInstances
            Effect: Deny
            Action:
              - ec2:RunInstances
              - rds:CreateDBInstance
            Resource: "*"
            Condition:
              StringEquals:
                ec2:InstanceType:
                  - p3.2xlarge
                  - g4dn.12xlarge
                  - m5.24xlarge
                  - r5.24xlarge
      TargetIds:
        - !Ref SandboxOUId
        - !Ref DevOUId
