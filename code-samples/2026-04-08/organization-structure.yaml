AWSTemplateFormatVersion: '2010-09-09'
Description: 'Estructura completa de AWS Organization para equipo DevOps pequeño - Con OUs y SCPs recomendados'

Resources:

  # 1. La Organization (se crea solo una vez)
  Organization:
    Type: AWS::Organizations::Organization
    Properties:
      FeatureSet: ALL_FEATURES
      EnabledPolicyTypes: 
        - SERVICE_CONTROL_POLICY # <--- CRÍTICO para que funcionen las SCPs

  # 2. Organizational Units (OUs)
  SecurityOU:
    Type: AWS::Organizations::OrganizationalUnit
    Properties:
      Name: Security
      ParentId: !GetAtt Organization.RootId

  InfrastructureOU:
    Type: AWS::Organizations::OrganizationalUnit
    Properties:
      Name: Infrastructure
      ParentId: !GetAtt Organization.RootId

  WorkloadsOU:
    Type: AWS::Organizations::OrganizationalUnit
    Properties:
      Name: Workloads
      ParentId: !GetAtt Organization.RootId

  SandboxOU:
    Type: AWS::Organizations::OrganizationalUnit
    Properties:
      Name: Sandbox
      ParentId: !Ref WorkloadsOU

  DevOU:
    Type: AWS::Organizations::OrganizationalUnit
    Properties:
      Name: Dev
      ParentId: !Ref WorkloadsOU

  ProdOU:
    Type: AWS::Organizations::OrganizationalUnit
    Properties:
      Name: Prod
      ParentId: !Ref WorkloadsOU

  # 3. Cuentas miembro (emails hardcodeados - cámbialos antes de desplegar)
  SecurityAuditAccount:
    Type: AWS::Organizations::Account
    Properties:
      AccountName: security-audit
      Email: security-audit@tu-dominio.com
      ParentIds: 
        - !Ref SecurityOU
      RoleName: OrganizationAccountAccessRole

  # Cuenta para centralizar Redes (Transit Gateway, Shared VPC, VPN)
  NetworkHubAccount:
    Type: AWS::Organizations::Account
    Properties:
      AccountName: network-hub
      Email: network-hub@tu-dominio.com # Cambia esto
      ParentIds: 
        - !Ref InfrastructureOU
      RoleName: OrganizationAccountAccessRole

  SharedServicesAccount:
    Type: AWS::Organizations::Account
    Properties:
      AccountName: shared-services
      Email: shared-services@tu-dominio.com
      ParentIds: 
        - !Ref InfrastructureOU
      RoleName: OrganizationAccountAccessRole

  SandboxAccount:
    Type: AWS::Organizations::Account
    Properties:
      AccountName: sandbox
      Email: sandbox@tu-dominio.com
      ParentIds: 
        - !Ref SandboxOU
      RoleName: OrganizationAccountAccessRole

  DevAccount:
    Type: AWS::Organizations::Account
    Properties:
      AccountName: dev
      Email: dev@tu-dominio.com
      ParentIds: 
        - !Ref DevOU
      RoleName: OrganizationAccountAccessRole

  ProdAccount:
    Type: AWS::Organizations::Account
    Properties:
      AccountName: prod
      Email: prod@tu-dominio.com
      ParentIds: 
        - !Ref ProdOU
      RoleName: OrganizationAccountAccessRole

  # 4. SCPs recomendados (adjuntados al Root o a OUs específicas)

  # SCP 1: Proteger la cuenta Management (Root) - Impide acciones con usuario root
  ProtectManagementAccountSCP:
    Type: AWS::Organizations::Policy
    Properties:
      Name: Protect-Management-Account
      Description: Protege la cuenta raíz de acciones peligrosas usando credenciales root
      Type: SERVICE_CONTROL_POLICY
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ProtectRootUser
            Effect: Deny
            Action: "*"
            Resource: "*"
            Condition:
              StringEquals:
                aws:PrincipalARN: "arn:aws:iam::${aws:accountId}:root"
      TargetIds:
        - !GetAtt Organization.RootId

  # SCP 2 Corregido: Restringir regiones permitiendo servicios globales
  RestrictRegionsSCP:
    Type: AWS::Organizations::Policy
    Properties:
      Name: Restrict-Regions
      Description: Permite regiones aprobadas y servicios globales esenciales
      Type: SERVICE_CONTROL_POLICY
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyUnsupportedRegions
            Effect: Deny
            NotAction:
              # Lista de servicios que NO deben ser bloqueados (servicios globales)
              - iam:*
              - organizations:*
              - route53:*
              - budgets:*
              - waf:*
              - cloudfront:*
              - globalaccelerator:*
              - support:*
              - trustedadvisor:*
              - sts:*          # <--- AGREGADO
              - sso:*          # <--- AGREGADO
              - ce:*           # <--- AGREGADO
              - chatbot:*      # <--- Útil para alertas en Slack/Teams
            Resource: "*"
            Condition:
              StringNotEquals:
                aws:RequestedRegion:
                  - us-east-1
                  - sa-east-1
      TargetIds:
        - !GetAtt Organization.RootId

  # SCP 3: Forzar tagging obligatorio (CostCenter y Environment)
  RequireTagsSCP:
    Type: AWS::Organizations::Policy
    Properties:
      Name: Require-Tags
      Description: Obliga a usar tags CostCenter y Environment en recursos clave
      Type: SERVICE_CONTROL_POLICY
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: RequireCostCenterAndEnvironment
            Effect: Deny
            Action:
              - ec2:RunInstances
              - s3:CreateBucket
              - rds:CreateDBInstance
              - lambda:CreateFunction
              - dynamodb:CreateTable
            Resource: "*"
            Condition:
              Null:
                aws:RequestTag/CostCenter: "true"
                aws:RequestTag/Environment: "true"
      TargetIds:
        - !Ref WorkloadsOU   # Solo se aplica a Workloads (puedes cambiarlo)

  # SCP 4: Evitar que las cuentas salgan de la Organization
  PreventLeavingOrgSCP:
    Type: AWS::Organizations::Policy
    Properties:
      Name: Prevent-Leaving-Organization
      Description: Impide que las cuentas miembro abandonen la Organization
      Type: SERVICE_CONTROL_POLICY
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyLeaveOrganization
            Effect: Deny
            Action: organizations:LeaveOrganization
            Resource: "*"
      TargetIds:
        - !GetAtt Organization.RootId

  # SCP 5: Denegar recursos caros en Sandbox y Dev (control de costos)
  DenyExpensiveResourcesSCP:
    Type: AWS::Organizations::Policy
    Properties:
      Name: Deny-Expensive-Resources
      Description: Bloquea instancias y recursos muy caros en entornos no productivos
      Type: SERVICE_CONTROL_POLICY
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyHighCostInstances
            Effect: Deny
            Action:
              - ec2:RunInstances
              - rds:CreateDBInstance
            Resource: "*"
            Condition:
              StringEquals:
                ec2:InstanceType:
                  - p3.2xlarge
                  - g4dn.12xlarge
                  - m5.24xlarge
                  - r5.24xlarge
      TargetIds:
        - !Ref SandboxOU
        - !Ref DevOU